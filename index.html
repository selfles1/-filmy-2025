<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Best of 2025 — Film Diary</title>
<style>
:root{
 --bg:#090909;--panel:#121212;--panel2:#181818;--text:#f5f5f5;--muted:#929292;
 --gold:#d8b36a;--gold2:#f0d79e;--line:#272727;--green:#63b883;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(circle at 50% -10%,#302716 0,#15120d 22%,var(--bg) 52%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:900px;margin:auto;padding:18px 14px 60px}
.hero{padding:18px 4px 20px}
.kicker{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:800;text-transform:uppercase}
h1{font-family:Georgia,serif;font-size:42px;line-height:1;margin:7px 0 9px;font-weight:500;letter-spacing:-1px}
.subtitle{color:var(--muted);font-size:14px}
.stats{display:flex;align-items:end;justify-content:space-between;margin-top:22px}
.big{font-family:Georgia,serif;font-size:30px}.small{color:var(--muted);font-size:12px}
.bar{height:5px;background:#292929;border-radius:10px;margin-top:9px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:.25s}
.controls{position:sticky;top:0;z-index:5;background:#090909ee;backdrop-filter:blur(15px);padding:10px 0 12px}
.search{width:100%;background:#151515;color:white;border:1px solid #303030;border-radius:12px;padding:12px 14px;font-size:15px;outline:0}
.search:focus{border-color:#806b43}
.filters{display:flex;gap:7px;overflow:auto;padding-top:9px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
button{font:inherit}
.filter{white-space:nowrap;border:1px solid #303030;background:#151515;color:#aaa;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:700}
.filter.active{background:var(--gold);color:#17130b;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;min-height:180px;background:linear-gradient(145deg,#181818,#101010);border:1px solid var(--line);border-radius:15px;padding:13px;overflow:hidden;transition:.18s}
.card:active{transform:scale(.985)}
.rank{font-size:10px;color:var(--gold);letter-spacing:1px;font-weight:800}
.title{font-family:Georgia,serif;font-size:18px;line-height:1.15;margin:7px 0 9px}
.meta{font-size:11px;color:var(--muted);line-height:1.5}
.actions{position:absolute;bottom:11px;left:12px;right:12px;display:flex;gap:6px}
.watch,.fw{border-radius:9px;padding:8px 9px;font-size:11px;text-decoration:none;text-align:center;font-weight:750}
.watch{flex:1;background:#232323;color:#ddd;border:1px solid #353535;cursor:pointer}
.watch.checked{background:#183124;color:#8fe0ab;border-color:#27543a}
.fw{background:#211d16;color:var(--gold2);border:1px solid #493d29}
.card.watched{border-color:#31543f}
.card.watched .title{color:#aaa}
.card.watched:after{content:"✓";position:absolute;right:12px;top:10px;color:var(--green);font-weight:800}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.app{padding-left:24px;padding-right:24px}}
@media(max-width:380px){h1{font-size:36px}.title{font-size:16px}.card{min-height:175px}}

    .poster{
      position:relative; aspect-ratio:2/3; overflow:hidden; border-radius:14px 14px 8px 8px;
      background:
        radial-gradient(circle at 70% 18%, rgba(255,215,120,.32), transparent 24%),
        radial-gradient(circle at 20% 78%, rgba(110,120,255,.22), transparent 30%),
        linear-gradient(145deg, #161616 0%, #090909 55%, #1c1710 100%);
      border:1px solid rgba(255,255,255,.09);
      box-shadow:0 18px 35px rgba(0,0,0,.34);
    }
    .poster:before{
      content:""; position:absolute; inset:0;
      background:
        linear-gradient(120deg, transparent 0 35%, rgba(255,255,255,.05) 36% 37%, transparent 38%),
        repeating-linear-gradient(165deg, transparent 0 28px, rgba(255,255,255,.025) 29px 30px);
      mix-blend-mode:screen;
    }
    .poster .p-rank{position:absolute;top:12px;left:12px;font-size:11px;letter-spacing:.14em;color:#e6c36a;text-transform:uppercase}
    .poster .p-title{position:absolute;left:15px;right:15px;bottom:17px;font-family:Georgia,serif;font-size:clamp(22px,4vw,34px);line-height:.95;color:#f4f0e6;text-shadow:0 3px 15px #000}
    .poster .p-year{position:absolute;right:13px;top:13px;font-size:10px;color:#bbb;letter-spacing:.15em}
    .poster .p-line{position:absolute;left:15px;bottom:12px;width:34px;height:2px;background:#d8b65b}
    .card{overflow:hidden}
    .card-body{padding:14px 15px 16px}
    .card .title{margin-top:0}
    @media (min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
    
</head>
<body>
<div class="app">
<header class="hero">
 <div class="kicker">659 best of the year lists</div>
 <h1>Best of 2025</h1>
 <div class="subtitle">Twoja lista filmów do obejrzenia</div>
 <div class="stats">
  <div><span id="done" class="big">0</span><span class="small"> / <span id="total">0</span> obejrzanych</span></div>
  <div id="percent" class="small">0%</div>
 </div>
 <div class="bar"><div id="fill" class="fill"></div></div>
</header>
<section class="controls">
 <input id="search" class="search" type="search" placeholder="Szukaj filmu…">
 <div class="filters">
  <button class="filter active" data-f="all">Wszystkie</button>
  <button class="filter" data-f="todo">Do obejrzenia</button>
  <button class="filter" data-f="done">Obejrzane</button>
 </div>
</section>
<main id="grid" class="grid"></main>
</div>
<script>
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const FILMS=[];
let filter="all",query="";
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){
 const grid=document.getElementById("grid");
 const q=query.toLocaleLowerCase("pl-PL");
 const arr=FILMS.filter(f=>
   f.title.toLocaleLowerCase("pl-PL").includes(q) &&
   (filter==="all"||(filter==="done"&&f.watched)||(filter==="todo"&&!f.watched))
 );
 grid.innerHTML=arr.length?arr.map(f=>{
   const i=FILMS.indexOf(f);
   return `<article class="card ${f.watched?"watched":""}">
    <div class="rank">#${esc(f.nr)}</div>
    <div class="title">${esc(f.title)}</div>
    <div class="meta">Film z zestawienia Best of the Year 2025</div>
    <div class="actions">
      <button class="watch ${f.watched?"checked":""}" data-i="${i}">${f.watched?"✓ Obejrzany":"○ Obejrzałem"}</button>
      <a class="fw" href="${f.filmweb}" target="_blank" rel="noopener">Filmweb ↗</a>
    </div>
   </article>`;
 }).join(""):'<div class="empty">Nie znaleziono filmu.</div>';
 grid.querySelectorAll(".watch").forEach(b=>b.onclick=()=>{
   FILMS[+b.dataset.i].watched=!FILMS[+b.dataset.i].watched;
   save();render();
 });
 update();
}
function update(){
 const done=FILMS.filter(f=>f.watched).length,total=FILMS.length,p=total?Math.round(done/total*100):0;
 document.getElementById("done").textContent=done;
 document.getElementById("total").textContent=total;
 document.getElementById("percent").textContent=p+"%";
 document.getElementById("fill").style.width=p+"%";
}
function save(){
 try{localStorage.setItem("best-of-2025-watched",JSON.stringify(FILMS.map(f=>f.watched)))}catch(e){}
}
function load(){
 try{
  const a=JSON.parse(localStorage.getItem("best-of-2025-watched")||"null");
  if(Array.isArray(a))FILMS.forEach((f,i)=>f.watched=a[i]===true);
 }catch(e){}
}
document.getElementById("search").oninput=e=>{query=e.target.value;render()};
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{
 filter=b.dataset.f;
 document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");render();
});
load();render();
</script>
</body>
</html>
