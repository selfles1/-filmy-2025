<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#f5f1e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.hero{padding:42px 18px 24px;max-width:1100px;margin:auto}
.kicker{color:#d5b45c;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
h1{font:700 clamp(42px,9vw,78px)/.9 Georgia,serif;margin:10px 0 14px;letter-spacing:-.04em}
.sub{color:#999;font-size:14px;line-height:1.5}
.stats{display:flex;gap:25px;margin-top:22px;flex-wrap:wrap}
.stat b{font-size:25px}.stat span{display:block;color:#777;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.progress{height:4px;background:#242424;border-radius:99px;margin-top:22px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:#d5b45c}
.controls{position:sticky;top:0;z-index:5;background:rgba(8,8,8,.95);backdrop-filter:blur(14px);border-block:1px solid #202020;padding:11px 15px}
.controls-in{max-width:1100px;margin:auto;display:flex;gap:7px;flex-wrap:wrap}
input,button{font:inherit;background:#151515;color:#ddd;border:1px solid #303030;border-radius:11px;padding:10px 12px}
input{flex:1;min-width:190px}button.active{background:#d5b45c;color:#080808;font-weight:700}
.grid{max-width:1100px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:#111;border:1px solid #252525;border-radius:14px;overflow:hidden}
.poster{aspect-ratio:2/3;position:relative;padding:13px;display:flex;align-items:flex-end;background:
radial-gradient(circle at 75% 18%,rgba(213,180,92,.34),transparent 26%),
radial-gradient(circle at 15% 75%,rgba(90,90,150,.22),transparent 34%),
linear-gradient(145deg,#29251e,#080808 70%)}
.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.9))}
.rank{position:absolute;z-index:1;top:11px;left:11px;color:#d5b45c;font-size:11px;letter-spacing:.12em}
.ptitle{position:relative;z-index:1;font:700 clamp(19px,3.8vw,28px)/.95 Georgia,serif;text-shadow:0 3px 12px #000}
.info{padding:11px}.meta{font-size:11px;color:#777;margin-bottom:9px}
.actions{display:flex;gap:6px}.actions button{flex:1;font-size:12px;padding:9px 6px}
.actions button.watched{border-color:#718b63;color:#c0d5b7}
.fw{display:block;color:#ccc;text-decoration:none;border:1px solid #303030;border-radius:11px;padding:9px 9px;font-size:12px;white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;color:#777;padding:55px 10px}
</style>
</head>
<body>

<div class="stats">

<div class="progress"><i id="bar"></i></div>

<button id="reset">Reset zaznaczeń</button>
</div></nav>

<main id="grid" class="grid"></main>

const STORAGE = "best-of-2025-watched-v2";
let watched = {};
let currentFilter = "all";

try {
  watched = JSON.parse(localStorage.getItem(STORAGE) || "{}") || {};
} catch(e) { watched = {}; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function save() {
  try { localStorage.setItem(STORAGE, JSON.stringify(watched)); } catch(e) {}
}

function updateStats() {
  const seen = FILMS.filter(f => watched[f.nr]).length;
  document.getElementById("total").textContent = FILMS.length;
  document.getElementById("seen").textContent = seen;
  document.getElementById("left").textContent = FILMS.length - seen;
  document.getElementById("bar").style.width = (seen / FILMS.length * 100) + "%";
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const list = FILMS.filter(function(f) {
    const matchesSearch = !q || f.title.toLowerCase().includes(q);
    const matchesFilter =
      currentFilter === "all" ||
      (currentFilter === "seen" && watched[f.nr]) ||
      (currentFilter === "todo" && !watched[f.nr]);
    return matchesSearch && matchesFilter;
  });

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if (!list.length) {
    grid.innerHTML = '<div class="empty">Nie znaleziono filmów.</div>';
  } else {
    list.forEach(function(f) {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML =
        '<div class="poster">' +
          '<div class="rank">#' + esc(f.nr) + '</div>' +
          '<div class="ptitle">' + esc(f.title) + '</div>' +
        '</div>' +
        '<div class="info">' +
          '<div class="meta">Film z zestawienia Best of the Year 2025</div>' +
          '<div class="actions">' +
            '<button class="watch ' + (watched[f.nr] ? "watched" : "") + '" data-nr="' + esc(f.nr) + '">' +
              (watched[f.nr] ? "✓ Obejrzany" : "○ Obejrzeć") +
            '</button>' +
            '<a class="fw" href="' + f.filmweb + '" target="_blank" rel="noopener">Filmweb ↗</a>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });
  }
  updateStats();
}

document.getElementById("grid").addEventListener("click", function(e) {
  const button = e.target.closest("button[data-nr]");
  if (!button) return;
  const nr = button.getAttribute("data-nr");
  watched[nr] = !watched[nr];
  save();
  render();
});

document.getElementById("search").addEventListener("input", render);

document.querySelectorAll(".filter").forEach(function(button) {
  button.addEventListener("click", function() {
    currentFilter = button.dataset.filter;
    document.querySelectorAll(".filter").forEach(function(b) { b.classList.remove("active"); });
    button.classList.add("active");
    render();
  });
});

document.getElementById("reset").addEventListener("click", function() {
  if (confirm("Wyczyścić wszystkie zaznaczenia?")) {
    watched = {};
    save();
    render();
  }
});

render();
</script>
